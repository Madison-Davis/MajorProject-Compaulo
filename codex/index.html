<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compaulo - Codex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="../index.html">COMPAULO</a>
      <nav class="nav-pill" aria-label="Site navigation">
        <a class="nav-pill-link" href="../portfolio/index.html">PORTFOLIO</a>
        <a class="nav-pill-link" href="#top">CODEX</a>
        <a class="nav-pill-link" href="../cortex/index.html">CORTEX</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section reveal" style="padding-top:12rem;">
      <div class="container">
        <p class="kicker">COURSEWORK EXPLORER</p>
        <h1>CODEX</h1>
        <p class="lead" style="margin-bottom:3.5rem;">
          Key concepts distilled from university coursework across technology,
          economics, and business. Pick a category to explore.
        </p>

        <div class="lab-accordion">

          <!-- ── TECH ─────────────────────────────────────── -->
          <div class="lab-accord-item">
            <button class="lab-accord-header" aria-expanded="false">
              <span class="lab-accord-num">01</span>
              <span class="lab-accord-title">TECH</span>
              <span class="lab-accord-chevron" aria-hidden="true">›</span>
            </button>
            <div class="lab-accord-body">
              <div class="lab-accord-inner">
                <div class="course-grid lab-accord-grid">

                  <!-- AUTO-GENERATED: TECH START -->
                  <!-- AUTO-GENERATED: TECH END -->

                </div>
              </div>
            </div>
          </div>

          <!-- ── ECONOMICS ───────────────────────────────── -->
          <div class="lab-accord-item">
            <button class="lab-accord-header" aria-expanded="false">
              <span class="lab-accord-num">02</span>
              <span class="lab-accord-title">ECONOMICS</span>
              <span class="lab-accord-chevron" aria-hidden="true">›</span>
            </button>
            <div class="lab-accord-body">
              <div class="lab-accord-inner">
                <div class="course-grid lab-accord-grid" style="grid-template-columns:repeat(2,minmax(0,1fr));">

                  <!-- AUTO-GENERATED: ECONOMICS START -->
                  <!-- AUTO-GENERATED: ECONOMICS END -->

                </div>
              </div>
            </div>
          </div>

          <!-- ── BUSINESS ────────────────────────────────── -->
          <div class="lab-accord-item">
            <button class="lab-accord-header" aria-expanded="false">
              <span class="lab-accord-num">03</span>
              <span class="lab-accord-title">BUSINESS</span>
              <span class="lab-accord-chevron" aria-hidden="true">›</span>
            </button>
            <div class="lab-accord-body">
              <div class="lab-accord-inner">
                <div class="course-grid lab-accord-grid" style="grid-template-columns:repeat(2,minmax(0,1fr));">

                  <!-- AUTO-GENERATED: BUSINESS START -->
                  <!-- AUTO-GENERATED: BUSINESS END -->

                </div>
              </div>
            </div>
          </div>

        </div><!-- /.lab-accordion -->
      </div>
    </section>
  </main>

  <script>
    // Fade out before navigating to another page
    document.addEventListener('click', function(e) {
      var a = e.target.closest('a[href]');
      if (!a) return;
      var href = a.getAttribute('href');
      if (!href || href.charAt(0) === '#' || a.target === '_blank' || href.indexOf('://') !== -1) return;
      e.preventDefault();
      document.body.classList.add('page-transitioning');
      setTimeout(function() { window.location.href = href; }, 300);
    }, true);

    document.querySelectorAll('.lab-accord-header').forEach(btn => {
      btn.addEventListener('click', () => {
        const item = btn.closest('.lab-accord-item');
        const isOpen = item.classList.contains('is-open');
        item.classList.toggle('is-open', !isOpen);
        btn.setAttribute('aria-expanded', String(!isOpen));
      });
    });

    const obs = new IntersectionObserver(
      (entries) => entries.forEach(e =>
        e.isIntersecting
          ? e.target.classList.add("is-visible")
          : e.target.classList.remove("is-visible")
      ),
      { threshold: 0.1, rootMargin: "0px 0px -40px 0px" }
    );
    document.querySelectorAll(".reveal").forEach(el => obs.observe(el));
  </script>
</body>
</html>
